server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
#    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  server:
    enable-self-protection: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always


logging:
  level:
    org.springframework.cloud.gateway: INFO
