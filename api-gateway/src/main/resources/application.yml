server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Routes
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: driver-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/drivers/**

        - id: ride-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/rides/**

      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

  management:
    endpoints:
      web:
        exposure:
          include: health, info, gateway
    endpoint:
      gateway:
        enabled: true
      health:
        show-details: always


  logging:
    level:
      org.springframework.cloud.gateway: INFO