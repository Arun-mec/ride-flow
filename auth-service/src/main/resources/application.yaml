server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/rideflow_auth}
    username: ${DB_USERNAME:rideflow}
    password: ${DB_PASSWORD:rideflow}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

rideflow:
  jwt:
    secret: ${RIDEFLOW_JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    expiry-seconds: 3600
    issuer: rideflow-auth-service

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.hibernate.SQL: DEBUG