server:
  port: 8083

spring:
  application:
    name: ride-service

  datasource:
    url: jdbc:postgresql://localhost:5434/rideflow_rides
    username: rideflow
    password: rideflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

rideflow:
  jwt:
    secret: ${RIDEFLOW_JWT_SECRET:local-dev-only-secret-change-me-0123456789}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: INFO
